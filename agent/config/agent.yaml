# R1 agent — llm_daemon + orchestrator (Phase A/B)
system_prompt: |
  你是 youyeetoo R1 上的语音助手，名字叫小揽。
  规则：
  - 回答必须全部是简体中文，禁止出现任何英文、拼音、外语、数字串或特殊符号
  - 禁止 Markdown、列表、编号、括号说明和引用格式
  - 口语化，像跟朋友说话，每次一到两句，每句不超过二十个字
  - 直接说结论，不要铺垫，不要解释规则
max_new_tokens: 48
socket_path: /tmp/r1-llm.sock

vad:
  model: /userdata/voice/silero_vad.onnx
  sherpa_lib: /userdata/voice/sherpa-onnx-v1.12.8-linux-aarch64-shared-cpu/lib
  sample_rate: 16000
  chunk_ms: 100
  threshold: 0.5
  min_silence_duration: 0.4
  min_speech_duration: 0.25
  max_speech_duration: 30.0
  min_segment_sec: 0.5
  alsa_device: plughw:0,0

paths:
  agent_root: /userdata/agent
  utterance_wav: /userdata/agent/run/last_utterance.wav

asr:
  backend: streaming_paraformer
  model_dir: /userdata/voice/sherpa-onnx-streaming-paraformer-bilingual-zh-en
  encoder: encoder.int8.onnx
  decoder: decoder.int8.onnx
  tokens: tokens.txt
  sherpa_lib: /userdata/voice/sherpa-onnx-v1.12.8-linux-aarch64-shared-cpu/lib
  num_threads: 2
  partial_interval_sec: 0.8
  partial_min_sec: 0.6
  partial_enabled: true
  max_partials_per_utterance: 5
  # fallback sense_voice:
  # backend: sense_voice
  # model_dir: /userdata/voice/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17
  # sherpa_bin: /userdata/voice/sherpa-onnx-v1.12.8-linux-aarch64-shared-cpu/bin/sherpa-onnx-offline
  # language: zh

tts:
  backend: matcha
  model_dir: /userdata/voice/matcha-icefall-zh-baker
  vocoder: /userdata/voice/vocos-22khz-univ.onnx
  sherpa_bin: /userdata/voice/sherpa-onnx-v1.12.8-linux-aarch64-shared-cpu/bin/sherpa-onnx-offline-tts
  sherpa_lib: /userdata/voice/sherpa-onnx-v1.12.8-linux-aarch64-shared-cpu/lib
  num_threads: 2
  speed: 1.0
  max_chars: 80
  merge_max_chars: 40

api:
  enabled: true
  host: 127.0.0.1
  port: 8765
